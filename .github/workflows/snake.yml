name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 24 hours
    - cron: "0 0 * * *"
  
  # Allows manual execution from the Actions tab
  workflow_dispatch:
  
  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nafallauza
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#1e1b4b,#4c1d95,#7c3aed,#a855f7
            dist/github-snake-neon.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#0d1117,#0f172a,#0284c7,#0369a1,#00f2fe

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
